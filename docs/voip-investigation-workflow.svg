<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">VoIP support investigation workflow</title><desc id="d">A five-stage workflow from reported symptom through SIP signaling, SDP and RTP media inspection, Python and SQL evidence correlation, to a documented support handoff.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b3c"/><stop offset="1" stop-color="#080d20"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5b83ff"/><stop offset="1" stop-color="#35d3c6"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<text x="64" y="62" fill="#35d3c6" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">SUPPORT ENGINEERING · INVESTIGATION MAP</text>
<text x="64" y="108" fill="#f1f5ff" font-family="Arial,sans-serif" font-size="32" font-weight="700">From reported symptom to evidence-led handoff</text>
<text x="64" y="140" fill="#aab8dc" font-family="Arial,sans-serif" font-size="16">A repeatable workflow — not a claim that every incident has the same root cause.</text>
<g filter="url(#shadow)"><rect x="55" y="210" width="198" height="214" rx="18" fill="#111d42" stroke="#41588f" stroke-opacity=".7"/><circle cx="84" cy="244" r="17" fill="#203768"/><text x="84" y="250" text-anchor="middle" fill="#9db4ff" font-family="Arial,sans-serif" font-size="12" font-weight="700">01</text><text x="76" y="286" fill="#35d3c6" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">DEFINE</text><text x="76" y="321" fill="#f1f5ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Symptom & scope</text><text x="76" y="360" fill="#aab8dc" font-family="Arial,sans-serif" font-size="13">Timestamp · timezone</text><text x="76" y="382" fill="#aab8dc" font-family="Arial,sans-serif" font-size="13">Call-ID · endpoint</text></g><path d="M255 316h24m-8 -8 8 8-8 8" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="285" y="210" width="198" height="214" rx="18" fill="#111d42" stroke="#41588f" stroke-opacity=".7"/><circle cx="314" cy="244" r="17" fill="#203768"/><text x="314" y="250" text-anchor="middle" fill="#9db4ff" font-family="Arial,sans-serif" font-size="12" font-weight="700">02</text><text x="306" y="286" fill="#35d3c6" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SIGNALING</text><text x="306" y="321" fill="#f1f5ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">SIP transaction</text><text x="306" y="360" fill="#aab8dc" font-family="Arial,sans-serif" font-size="13">REGISTER / INVITE</text><text x="306" y="382" fill="#aab8dc" font-family="Arial,sans-serif" font-size="13">Responses · headers</text></g><path d="M485 316h24m-8 -8 8 8-8 8" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="515" y="210" width="198" height="214" rx="18" fill="#111d42" stroke="#41588f" stroke-opacity=".7"/><circle cx="544" cy="244" r="17" fill="#203768"/><text x="544" y="250" text-anchor="middle" fill="#9db4ff" font-family="Arial,sans-serif" font-size="12" font-weight="700">03</text><text x="536" y="286" fill="#35d3c6" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">MEDIA</text><text x="536" y="321" fill="#f1f5ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">SDP + RTP</text><text x="536" y="360" fill="#aab8dc" font-family="Arial,sans-serif" font-size="13">Negotiated IP:port</text><text x="536" y="382" fill="#aab8dc" font-family="Arial,sans-serif" font-size="13">Packets in both directions</text></g><path d="M715 316h24m-8 -8 8 8-8 8" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="745" y="210" width="198" height="214" rx="18" fill="#111d42" stroke="#41588f" stroke-opacity=".7"/><circle cx="774" cy="244" r="17" fill="#203768"/><text x="774" y="250" text-anchor="middle" fill="#9db4ff" font-family="Arial,sans-serif" font-size="12" font-weight="700">04</text><text x="766" y="286" fill="#35d3c6" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CORRELATE</text><text x="766" y="321" fill="#f1f5ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Python + SQL</text><text x="766" y="360" fill="#aab8dc" font-family="Arial,sans-serif" font-size="13">Parse · normalize</text><text x="766" y="382" fill="#aab8dc" font-family="Arial,sans-serif" font-size="13">Query · validate</text></g><path d="M945 316h24m-8 -8 8 8-8 8" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="975" y="210" width="198" height="214" rx="18" fill="#111d42" stroke="#41588f" stroke-opacity=".7"/><circle cx="1004" cy="244" r="17" fill="#203768"/><text x="1004" y="250" text-anchor="middle" fill="#9db4ff" font-family="Arial,sans-serif" font-size="12" font-weight="700">05</text><text x="996" y="286" fill="#35d3c6" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HANDOFF</text><text x="996" y="321" fill="#f1f5ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Findings + next steps</text><text x="996" y="360" fill="#aab8dc" font-family="Arial,sans-serif" font-size="13">Facts vs hypotheses</text><text x="996" y="382" fill="#aab8dc" font-family="Arial,sans-serif" font-size="13">Evidence · escalation</text></g>
<rect x="64" y="466" width="1072" height="52" rx="12" fill="#102c3b" stroke="#35d3c6" stroke-opacity=".45"/>
<text x="88" y="498" fill="#35d3c6" font-family="Arial,sans-serif" font-size="13" font-weight="700">QUALITY RULE</text><text x="225" y="498" fill="#d7e3f7" font-family="Arial,sans-serif" font-size="14">State what the evidence proves, what remains unknown, and exactly what to collect next.</text>
